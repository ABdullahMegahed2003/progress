name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || npx cap copy android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/gym-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-app-apk
          path: android/app/build/outputs/apk/debug/gym-app.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Gym App v1.0.0 APK"
          body: "Official Gym App Android APK Build"
          files: android/app/build/outputs/apk/debug/gym-app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
